[package]
name = "omnix-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust terminal frontend for Omnix CLI"
publish = false

[[bin]]
name = "omnix"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
