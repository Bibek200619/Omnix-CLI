name: Website checks

on:
  pull_request:
    paths:
      - "web_app/website/**"
      - "web_app/*.md"
      - "ai-cli/**"
      - ".github/workflows/website-checks.yml"
  push:
    branches: [main]
    paths:
      - "web_app/website/**"
      - "web_app/*.md"
      - "ai-cli/**"
      - ".github/workflows/website-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web_app/website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_app/website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run review:build
