name: CLI release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            binary: omnix
          - target: macos-aarch64
            runner: macos-14
            binary: omnix
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_DATE_EPOCH: "0"
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: rustup update stable

      - name: Install uv
        run: python -m pip install "uv==0.11.22"

      - name: Validate release tag matches CLI version
        working-directory: ai-cli
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"release tag must be {expected}")
          PY

      - name: Build Python engine wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist ai-cli
          uv export --directory ai-cli --locked --no-dev --no-emit-project \
            --format requirements.txt --output-file dist/requirements.txt

      - name: Build Rust terminal frontend
        run: cargo build --locked --release --manifest-path rust-tui/Cargo.toml

      - name: Assemble platform archive
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          python packaging/create-bundle.py \
            --binary "rust-tui/target/release/${BINARY}" \
            --wheel-dir dist \
            --requirements dist/requirements.txt \
            --uninstaller packaging/uninstall.sh \
            --target "$TARGET" \
            --output "dist/omnix-${TARGET}.tar.gz"

      - name: Upload platform archive for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: omnix-${{ matrix.target }}
          path: dist/omnix-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: omnix-*
          merge-multiple: true

      - name: Add install and removal scripts
        run: cp packaging/*.sh dist/

      - name: Create release checksums
        run: (cd dist && sha256sum omnix-*.tar.gz install.sh uninstall.sh > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/omnix-*.tar.gz
            dist/install.sh
            dist/uninstall.sh
            dist/SHA256SUMS

      - name: Upload verified artifacts to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
